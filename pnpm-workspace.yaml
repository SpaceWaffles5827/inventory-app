# Single-package repo: pnpm still requires a packages list when this file
# exists, otherwise every pnpm command fails with "packages field missing or empty".
packages:
  - .
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  core-js: true
  esbuild: true
  msw: true
  node: false
  prisma: true
  sharp: true
  unrs-resolver: true
