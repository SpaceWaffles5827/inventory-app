# docker-compose.dev.yml (env-driven ports)
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-dev
    ports:
      - "${MYSQL_PORT:-3307}:3306"   # host -> container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-log-bin
    volumes:
      - ./dev/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  prisma-bootstrap:
    image: node:22-alpine
    container_name: prisma-bootstrap
    working_dir: /workspace
    volumes:
      - ./prisma:/workspace/prisma:ro
    env_file: [.dev.env]
    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      mysql-init-grants:
        condition: service_completed_successfully
    command: >
      sh -lc "
        set -euo pipefail
        apk add --no-cache mysql-client >/dev/null
        [ -f /workspace/prisma/schema.prisma ] || { echo 'ERROR: schema.prisma missing'; exit 2; }
        npx --yes prisma --version || true
        npx --yes prisma db push --schema /workspace/prisma/schema.prisma --accept-data-loss
        mysql -hmysql -P3306 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e \"USE $${MYSQL_DATABASE}; SHOW TABLES;\"
        mysql -hmysql -P3306 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" -e \"USE $${MYSQL_DATABASE}; SHOW TABLES;\" || echo 'appuser verification failed'
      "
    restart: "no"

  mysql-shadow-init:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
      mysql-init-grants:
        condition: service_completed_successfully
    env_file: [.dev.env]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: >
      sh -lc "
        mysql -hmysql -P3306 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e \"
          CREATE DATABASE IF NOT EXISTS $${MYSQL_DATABASE}_shadow;
          CREATE USER IF NOT EXISTS '$${MYSQL_USER}'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';
          GRANT ALL ON $${MYSQL_DATABASE}_shadow.* TO '$${MYSQL_USER}'@'%';
          FLUSH PRIVILEGES;
        \"
      "
    restart: "no"

  redis:
    image: redis:7
    container_name: redis-dev
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    tmpfs:
      - /data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-dev
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./dev/minio:/data
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    env_file: [.dev.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
        set -eu
        sleep 5
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
        mc ls local/$${BUCKET_NAME} >/dev/null 2>&1 || mc mb local/$${BUCKET_NAME}
        exit 0
      "
    restart: "no"

  mc-replication-setup:
    image: minio/mc:latest
    depends_on: [minio]
    env_file: [.dev.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PRIMARY_URL: http://minio:9000
      DR_MINIO_ROOT_USER: ${DR_MINIO_ROOT_USER}
      DR_MINIO_ROOT_PASSWORD: ${DR_MINIO_ROOT_PASSWORD}
      DR_URL: ${DR_ENDPOINT}
      BUCKET: ${BUCKET_NAME}
      DR_BUCKET: ${DR_BUCKET_NAME:-${BUCKET_NAME}}
      MC_INSECURE: ${MC_INSECURE}
    entrypoint: >
      /bin/sh -c '
        set -eu
        for i in $(seq 1 60); do
          if mc alias set primary "$$PRIMARY_URL" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then break; fi
          sleep 2
        done
        mc alias set dr "$$DR_URL" "$$DR_MINIO_ROOT_USER" "$$DR_MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing primary/"$$BUCKET"
        mc mb --ignore-existing dr/"$$DR_BUCKET"
        mc version enable primary/"$$BUCKET" || true
        mc version enable dr/"$$DR_BUCKET" || true
        mc replicate add primary/"$$BUCKET" --remote-bucket "dr/$$DR_BUCKET" --replicate existing-objects,delete,delete-marker,metadata-sync --priority 1 || true
        mc replicate ls primary/"$$BUCKET"
      '
    restart: "no"

  mc-seed-once:
    image: minio/mc:latest
    depends_on: [minio]
    env_file: [.dev.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DR_MINIO_ROOT_USER: ${DR_MINIO_ROOT_USER}
      DR_MINIO_ROOT_PASSWORD: ${DR_MINIO_ROOT_PASSWORD}
      PRIMARY_URL: http://minio:9000
      DR_URL: ${DR_ENDPOINT}
      BUCKET: ${BUCKET_NAME}
      DR_BUCKET: ${DR_BUCKET_NAME:-${BUCKET_NAME}}
      MC_INSECURE: ${MC_INSECURE}
    entrypoint: >
      /bin/sh -c '
        set -eu
        mc alias set primary "$$PRIMARY_URL" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc alias set dr "$$DR_URL" "$$DR_MINIO_ROOT_USER" "$$DR_MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing dr/"$$DR_BUCKET" || true
        mc version enable dr/"$$DR_BUCKET" || true
        mc mirror --overwrite primary/"$$BUCKET" dr/"$$DR_BUCKET"
      '
    restart: "no"

  mysql-init-grants:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    env_file: [.dev.env]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: |-
      sh -lc "
        set -eu
        mysql -hmysql -P3306 -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e \"
          CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE};
          CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
          CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'localhost' IDENTIFIED BY '${MYSQL_PASSWORD}';
          ALTER USER '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
          ALTER USER '${MYSQL_USER}'@'localhost' IDENTIFIED BY '${MYSQL_PASSWORD}';
          GRANT ALL ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'%';
          GRANT ALL ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'localhost';
          FLUSH PRIVILEGES;
        \"
      "
    restart: "no"

volumes:
  mysql-data:
  minio-data:
