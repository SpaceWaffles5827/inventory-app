services:
  traefik:
    image: traefik:v2.10
    networks:
      proxy:
        aliases:
          - traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --log.level=DEBUG
    ports:
      - "${TRAEFIK_HTTP_PORT:-3069}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  app:
    image: ghcr.io/spacewaffles5827/inventory-app:latest
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: "HostRegexp(`{host:.+}`)"
      traefik.http.routers.app.entrypoints: "web"
      traefik.http.routers.app.priority: "10"
      traefik.http.services.app.loadbalancer.server.port: "${APP_INTERNAL_PORT:-3000}"
    env_file: [.env]
    environment:
      PORT: "${APP_INTERNAL_PORT:-3000}"
      DEV_MODE: "false"
      REDIS_PORT: "6379" # in-cluster redis port
      NEXT_PUBLIC_APP_URL: "http://inventory-app.com"
      NEXT_PUBLIC_API_URL: "http://server:${SERVER_INTERNAL_PORT:-5001}"
    expose: ["${APP_INTERNAL_PORT:-3000}"]
    depends_on:
      - redis
    extra_hosts:
      - "inventory-app.com:host-gateway"
    networks: [proxy]
    restart: unless-stopped

  server:
    image: ghcr.io/spacewaffles5827/inventory-app-server:latest
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "PathPrefix(`/api`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.routers.api.priority: "100"
      traefik.http.services.api.loadbalancer.server.port: "${SERVER_INTERNAL_PORT:-5001}"
    env_file: [.env]
    environment:
      PORT: "${SERVER_INTERNAL_PORT:-5001}"
      DEV_MODE: "false"
      REDIS_PORT: "6379" # in-cluster redis port
      NEXT_PUBLIC_APP_URL: "http://inventory-app.com"
      NEXT_PUBLIC_API_URL: "http://server:${SERVER_INTERNAL_PORT:-5001}"
      # use service DNS + internal 3306 for DB
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      BUCKET_NAME: "${BUCKET_NAME}"
    expose: ["${SERVER_INTERNAL_PORT:-5001}"]
    depends_on:
      prisma-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    extra_hosts:
      - "inventory-app.com:host-gateway"
    networks: [proxy]
    restart: unless-stopped

  redis:
    image: redis:latest
    command: ["redis-server"]
    # publish only if you need host access; otherwise just expose 6379
    ports:
      - "${REDIS_PORT:-6380}:6379"
    # expose: ["6379"]
    restart: always
    networks: [proxy]

  # Primary MinIO (Docker-local, S3 on 9000, Console on 9001)
  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio/data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000" # S3/API (internal stays 9000)
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Console (internal stays 9001)
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks: [proxy]

  # Create primary buckets + enable versioning (runs once)
  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    env_file: [.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
        set -e
        sleep 5;
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc ls local/$${BUCKET_NAME} >/dev/null 2>&1 || mc mb local/$${BUCKET_NAME};
        mc version enable local/$${BUCKET_NAME} || true;
        mc ls local/$${BUCKET_NAME}-backups >/dev/null 2>&1 || mc mb local/$${BUCKET_NAME}-backups;
        mc version enable local/$${BUCKET_NAME}-backups || true;
        echo 'Primary buckets ready.'
      "
    restart: "no"
    networks: [proxy]

  # MySQL
  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    env_file: [.env]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [proxy]
    restart: unless-stopped

  prisma-migrate:
    image: ghcr.io/spacewaffles5827/inventory-app-server:latest
    working_dir: /app
    command: sh -c "npx prisma migrate deploy && (npx prisma db seed || echo 'no seed configured, skipping') && echo 'Prisma migrations complete.'"
    env_file: [.env]
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [proxy]
    restart: "no"

  # Nightly MySQL dump -> TrueNAS backup bucket (HTTP on DR)
  mysql-dump-to-minio:
    image: alpine:3.20
    restart: unless-stopped
    # Pull secrets/vars from your .env (recommend)
    env_file: [.env]
    environment:
      # Prefer host-published port by default; can switch to mysql:3306 if you want
      MYSQL_HOST: "${MYSQL_HOST:-host.docker.internal}"
      MYSQL_PORT: "${MYSQL_PORT:-3307}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"

      MINIO_ENDPOINT: "${DR_ENDPOINT}" # e.g. http://192.168.1.88:${MINIO_API_PORT}
      MINIO_ROOT_USER: "${DR_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${DR_MINIO_ROOT_PASSWORD}"
      BUCKET_NAME: "${BACKUP_BUCKET_NAME:-inventory-app-backups}"

      # Cron runs in UTC inside the container
      CRON_TIME: "${BACKUP_CRON:-0 3 * * *}"

      # One-shot toggle for manual runs
      RUN_ONCE: "${RUN_ONCE:-}"

      # Set 1 if your MINIO_ENDPOINT is plain HTTP
      MC_INSECURE: "${MC_INSECURE:-0}"
    networks: [proxy]
    entrypoint: >
      sh -lc '
        set -e

        # Tools (kept inline for now; consider baking into a tiny image for speed)
        apk add --no-cache mysql-client curl ca-certificates >/dev/null
        curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
        chmod +x /usr/local/bin/mc

        # Resolve MySQL quickly (no Docker DNS flakiness)
        echo "==> Waiting for MySQL at ${MYSQL_HOST}:${MYSQL_PORT} ..."
        for i in $$(seq 1 60); do
          if mysqladmin --protocol=TCP -h"$$MYSQL_HOST" -P"$$MYSQL_PORT" -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" ping >/dev/null 2>&1; then
            break
          fi
          echo "Waiting for MySQL...($$i)"; sleep 2
        done

        # MinIO alias
        INSEC=""; [ "$${MC_INSECURE:-}" = "1" ] && INSEC="--insecure"
        echo "==> Waiting for MinIO at ${MINIO_ENDPOINT} ..."
        for i in $$(seq 1 60); do
          if mc alias set backup "$$MINIO_ENDPOINT" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" $$INSEC >/dev/null 2>&1; then
            break
          fi
          echo "Waiting for MinIO...($$i)"; sleep 2
        done

        mc ls backup/"$$BUCKET_NAME" >/dev/null 2>&1 || mc mb backup/"$$BUCKET_NAME"
        mc version enable backup/"$$BUCKET_NAME" || true

        # Choose dump flags based on client (MariaDB vs MySQL)
        DUMP_FLAGS="--single-transaction --quick --routines --events --triggers"
        if mysqldump --version 2>&1 | grep -qi mariadb; then
          :
        else
          DUMP_FLAGS="$$DUMP_FLAGS --set-gtid-purged=OFF --column-statistics=0"
        fi

        dump_and_push() {
          TS=$$(date -u +%Y%m%d%H%M)
          echo "Starting MySQL dump at $$TS"
          mysqldump --protocol=TCP -h "$$MYSQL_HOST" -P "$$MYSQL_PORT" -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" \
            $$DUMP_FLAGS \
            | gzip -c \
            | mc pipe backup/"$$BUCKET_NAME/mysql/$$TS.$$MYSQL_DATABASE.sql.gz"
          echo "Dump complete"
        }

        if [ "$$RUN_ONCE" = "1" ]; then dump_and_push; exit 0; fi
        printf "%s\n" "$$(declare -f dump_and_push)" > /dump_fn.sh
        echo "$$CRON_TIME . /dump_fn.sh && dump_and_push" > /etc/crontabs/root
        echo "==> Cron scheduled: $$CRON_TIME (UTC)"
        crond -f -l 2
      '

  # Seed DR from Primary once
  minio-initial-mirror:
    image: minio/mc:latest
    depends_on: [minio, minio-setup]
    env_file: [.env]
    environment:
      BUCKET_NAME: ${BUCKET_NAME}
      DR_BUCKET_NAME: ${DR_BUCKET_NAME}
      DR_ENDPOINT: "http://192.168.1.88:9000"
      DR_MINIO_ROOT_USER: ${DR_MINIO_ROOT_USER}
      DR_MINIO_ROOT_PASSWORD: ${DR_MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-lc", "/scripts/seed-minio.sh"]
    restart: "no"
    networks: [proxy]

  # Configure ongoing replication Primary -> DR
  minio-replication-setup:
    image: minio/mc:latest
    depends_on: [minio, minio-initial-mirror]
    env_file: [.env]
    environment:
      BUCKET_NAME: ${BUCKET_NAME}
      DR_BUCKET_NAME: ${DR_BUCKET_NAME}
      DR_ENDPOINT: "http://192.168.1.88:9000"
      DR_MINIO_ROOT_USER: ${DR_MINIO_ROOT_USER}
      DR_MINIO_ROOT_PASSWORD: ${DR_MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      REPL_ACTIONS: "existing-objects,delete,delete-marker,metadata-sync"
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-lc", "/scripts/setup-replication.sh"]
    restart: "no"
    networks: [proxy]

volumes:
  minio_data:
  mysql_data:

networks:
  proxy:
    name: proxy # engine-scoped; auto-create or reuse
    driver: bridge
    attachable: true
