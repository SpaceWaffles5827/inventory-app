# docker-compose.test.yml (isolated test environment)
services:
  mysql-test:
    image: mysql:8.0
    container_name: mysql-test
    ports:
      - "${MYSQL_PORT:-3308}:3306" # Different port (3308)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-log-bin
    volumes:
      - ./test/mysql:/var/lib/mysql # Different storage location
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  prisma-bootstrap-test:
    image: node:22-alpine
    container_name: prisma-bootstrap-test
    working_dir: /workspace
    volumes:
      - ./prisma:/workspace/prisma:ro
    env_file: [.test.env]
    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql-test:3306/${MYSQL_DATABASE}"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql-test:
        condition: service_healthy
      mysql-init-grants-test:
        condition: service_completed_successfully
    command: >
      sh -lc "
        set -euo pipefail
        apk add --no-cache mysql-client >/dev/null
        [ -f /workspace/prisma/schema.prisma ] || { echo 'ERROR: schema.prisma missing'; exit 2; }
        npx --yes prisma --version || true
        npx --yes prisma db push --schema /workspace/prisma/schema.prisma --accept-data-loss
        mysql -hmysql-test -P3306 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e \"USE $${MYSQL_DATABASE}; SHOW TABLES;\"
      "
    restart: "no"

  mysql-shadow-init-test:
    image: mysql:8.0
    depends_on:
      mysql-test:
        condition: service_healthy
      mysql-init-grants-test:
        condition: service_completed_successfully
    env_file: [.test.env]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: >
      sh -lc "
        mysql -hmysql-test -P3306 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e \"
          CREATE DATABASE IF NOT EXISTS $${MYSQL_DATABASE}_shadow;
          CREATE USER IF NOT EXISTS '$${MYSQL_USER}'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';
          GRANT ALL ON $${MYSQL_DATABASE}_shadow.* TO '$${MYSQL_USER}'@'%';
          FLUSH PRIVILEGES;
        \"
      "
    restart: "no"

  redis-test:
    image: redis:7
    container_name: redis-test
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--loglevel",
        "warning",
      ]
    ports:
      - "${REDIS_PORT:-6381}:6379" # Different port (6381)
    tmpfs:
      - /data
    restart: unless-stopped

  minio-test:
    image: quay.io/minio/minio:latest
    container_name: minio-test
    ports:
      - "${MINIO_API_PORT:-9002}:9000" # Different port (9002)
      - "${MINIO_CONSOLE_PORT:-9003}:9001" # Different port (9003)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./test/minio:/data # Different storage location
    restart: unless-stopped

  minio-setup-test:
    image: minio/mc:latest
    depends_on: [minio-test]
    env_file: [.test.env]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: ${BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
        set -eu
        sleep 5
        mc alias set local http://minio-test:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
        mc ls local/$${BUCKET_NAME} >/dev/null 2>&1 || mc mb local/$${BUCKET_NAME}
        exit 0
      "
    restart: "no"

  mysql-init-grants-test:
    image: mysql:8.0
    depends_on:
      mysql-test:
        condition: service_healthy
    env_file: [.test.env]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: |-
      sh -lc "
        set -eu
        mysql -hmysql-test -P3306 -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e \"
          CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE};
          CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
          CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'localhost' IDENTIFIED BY '${MYSQL_PASSWORD}';
          ALTER USER '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
          ALTER USER '${MYSQL_USER}'@'localhost' IDENTIFIED BY '${MYSQL_PASSWORD}';
          GRANT ALL ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'%';
          GRANT ALL ON ${MYSQL_DATABASE}.* TO '${MYSQL_USER}'@'localhost';
          FLUSH PRIVILEGES;
        \"
      "
    restart: "no"
